name: Build Desktop Companions

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Companion (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller qrcode

      - name: Build macOS App Bundle
        run: |
          pyinstaller --name "BlanketCozzy" \
            --windowed \
            --onedir \
            server/server.py

      - name: Package into DMG & ZIP
        run: |
          mkdir -p dmg_root
          cp -R dist/BlanketCozzy.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "BlanketCozzy TrackPad" -srcfolder dmg_root -ov -format UDZO dist/BlanketCozzy-macOS.dmg
          cd dist && zip -r BlanketCozzy-macOS.zip BlanketCozzy.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-companion
          path: |
            dist/BlanketCozzy-macOS.dmg
            dist/BlanketCozzy-macOS.zip

  build-windows:
    name: Build Windows Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qrcode

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --name "BlanketCozzy-Windows" `
            --onefile `
            --windowed `
            server/server.py

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: dist/BlanketCozzy-Windows.exe

  release:
    name: Publish Release Assets
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-companion
          path: release_assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-companion
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'BlanketCozzy Desktop Companion (Latest)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/BlanketCozzy-macOS.dmg
            release_assets/BlanketCozzy-macOS.zip
            release_assets/BlanketCozzy-Windows.exe
